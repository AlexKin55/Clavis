# Shared PostgreSQL service for all Clavis Key Server instances.
#
# Every Key Server connects to the SAME database (see server.yaml -> db_url),
# so all servers see the same agents, reader keys and audit trail: the
# database itself is the source of truth, no extra replication needed.
#
# Usage:
#   docker compose -f postgres/compose.yml up -d
#
# DSN example:
#   postgres://clavis:change-me@127.0.0.1:5432/clavis?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    container_name: clavis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clavis
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: clavis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The schema is applied automatically by the Key Server on start;
      # the mounted script exists for manual provisioning.
      - ./schema.sql:/docker-entrypoint-initdb.d/20-clavis-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clavis -d clavis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: