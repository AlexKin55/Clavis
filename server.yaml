# Clavis Key Server sample configuration.
#
# Run: go run ./server -config server.yaml

# Listen address of the API.
listen: "127.0.0.1:8443"

# Default key lifetime granted on first issuance (seconds).
default_ttl_seconds: 3600

tls:
  # Server certificate and private key. Leave empty to serve plain HTTP
  # (localhost/testing only).
  cert_file: "/etc/clavis/server.pem"
  key_file: "/etc/clavis/server-key.pem"
  # Client CA bundle. When set, agents must present a valid client
  # certificate (mutual TLS); the CN becomes the agent ID.
  ca_file: "/etc/clavis/agents-ca.pem"