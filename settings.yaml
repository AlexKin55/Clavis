# Sample Clavis agent settings (Go).
#
# Default paths mirror the C++ prototype (cybersafe/settings/settings.yaml)
# but can be overridden for a particular workstation.

agent:
  id: "clavis-001"
  # Address of the HTTP /healthz endpoint; empty disables the server.
  health_listen: "127.0.0.1:8901"

crypto:
  # Path to the file with the key material (hex or raw 16/24/32 bytes).
  key_file: "/etc/clavis/agent.key"
  # Default algorithm for new documents.
  algorithm: "aes-256-ctr"
  # v2 agent identity state (master key A, signing key, server S/nonce).
  # Required when the Key Server is used.
  identity_file: "/var/lib/clavis/identity.json"

policy:
  # Allow access for processes running as root.
  allow_uid0: false
  # Allow access for processes inside a Firejail sandbox.
  allow_firejail: true
  # Executable names (/proc/<pid>/comm) allowed to open protected documents.
  whitelist: []

token:
  # PKCS#11 hardware token. When module_path is set (and server.url is
  # empty), the token becomes the only source of key material: documents
  # are unreachable without the token/pin.
  module_path: ""
  token_label: "Clavis"
  pin: "0000"
  wrap_key_label: "clavis-wrap"
  generate_wrap_key: true
  blobs_dir: "/var/lib/clavis/tokens"

server:
  # Key Server URL; empty disables the server and uses the local key file.
  url: ""
  # CA bundle that signed the server certificate (mTLS).
  ca_file: "/etc/clavis/server-ca.pem"
  # Agent client certificate and private key (mTLS).
  cert_file: "/etc/clavis/agent.pem"
  key_file: "/etc/clavis/agent-key.pem"
  # Request timeout in seconds.
  timeout_seconds: 10

fuse:
  # Directory where the encrypted files physically reside (must exist).
  directory: "/opt/clavis/data"
  # Mount point — the user sees decrypted files here.
  mount_point: "/home/alex/Clavis"
  # FUSE arguments (same as fuse.options in C++).
  options:
    - "-f"
    - "-d"
    - "-o"
    - "auto_unmount,allow_other"

log:
  # Agent log file path. Empty means stderr only.
  file: "/var/log/clavis/agent.log"
  # Maximum file size before rotation (KB/MB/GB or bare bytes).
  size: "5MB"
  # Number of rotated log files to keep.
  count: "3"
  # Level: trace, debug, info, warn, error.
  level: "debug"